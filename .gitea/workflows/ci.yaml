name: ci

# Test gate on every branch and pull request. build-and-push.yaml rebuilds from
# scratch inside the image for main/dev, so this deliberately overlaps there —
# the point is that a failing test is visible before the image is published.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle's own caches plus the Node toolchain and node_modules the Gradle
      # node plugin manages under .gradle/ and frontend/.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle/nodejs
            frontend/node_modules
          key: gradle-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts', 'frontend/package-lock.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore
